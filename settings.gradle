rootProject.name = 'TeraNUI'
include 'nui-reflect', 'nui-input', 'nui', 'nui-gestalt5', 'nui-gestalt7', 'nui-libgdx'

// Same convention as gestalt's settings.gradle.kts: only include the Android verification module
// when a local Android SDK is actually configured, so the default build (no SDK required) isn't
// affected for anyone who doesn't need it.
if (new File(rootDir, 'local.properties').exists()) {
    include 'nui-android-verify'
} else {
    println 'No local.properties file found, bypassing the Android build-verification module'
}
