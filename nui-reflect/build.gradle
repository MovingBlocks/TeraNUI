plugins {
    id 'java-library'
    id 'maven-publish'
}

apply from: "$rootDir/gradle/common.gradle"

dependencies {
    implementation "org.slf4j:slf4j-api:1.7.30"
    // See nui/build.gradle for why this is the org.terasology fork, not upstream.
    implementation group: 'org.terasology', name: 'reflections', version: '0.9.12-MB'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.6.2'

    implementation group: 'com.google.guava', name: 'guava', version: '23.0'
    api ('org.joml:joml') {
        version {
            require jomlVersion
        }
    }

    api ('org.terasology.joml-ext:joml-geometry') {
        version {
            require geomVersion
        }
    }
}
